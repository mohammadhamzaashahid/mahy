# HTTP -> redirect everything to HTTPS
server {
    listen 80;
    server_name staging.mahykhoory.com;
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name staging.mahykhoory.com;

    ssl_certificate     /etc/letsencrypt/live/staging.mahykhoory.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.mahykhoory.com/privkey.pem;

    # --- your CDN: serve /assets straight from disk ---
    location /assets/ {
        alias /srv/mahy/assets/;
        access_log off;
        gzip_static on;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    # --- everything else -> Next.js container ---
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    client_max_body_size 25m;
}
