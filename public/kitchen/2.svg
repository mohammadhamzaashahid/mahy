<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Cabinet body -->
  <rect x="6" y="10" width="52" height="44" rx="3" stroke="white" stroke-width="2.5" fill="none"/>
  <!-- Countertop line -->
  <line x1="6" y1="30" x2="58" y2="30" stroke="white" stroke-width="2.5"/>
  <!-- Left upper door -->
  <rect x="10" y="14" width="18" height="12" rx="1.5" stroke="white" stroke-width="1.8" fill="none"/>
  <!-- Left door handle -->
  <line x1="16" y1="20" x2="20" y2="20" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Right upper door (open) -->
  <path d="M36 14 L54 14 L54 26 L36 26 Z" stroke="white" stroke-width="1.8" fill="none"/>
  <!-- Right door handle -->
  <line x1="44" y1="20" x2="48" y2="20" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Shelf inside open cabinet -->
  <line x1="37" y1="20" x2="53" y2="20" stroke="white" stroke-width="1.2" stroke-dasharray="2 2"/>
  <!-- Lower drawer -->
  <rect x="10" y="34" width="44" height="10" rx="1.5" stroke="white" stroke-width="1.8" fill="none"/>
  <!-- Drawer handle -->
  <line x1="27" y1="39" x2="37" y2="39" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Lower base -->
  <rect x="10" y="48" width="44" height="3" rx="1" fill="white" opacity="0.4"/>
</svg>